- id: '1790102634665'
  alias: Humidity AC control - on above 70%, off below 60%
  description: Runs the Smart Life "Ac on" scene when the Qingping's humidity stays
    above 70% for 5 minutes, and "Ac off" when it stays below 60% for 5 minutes (10-point
    gap so it can't flap). Announces each switch on shubham's 3rd Echo Dot. Skips
    the moment the sensor comes back from a Bluetooth dropout, so a dropout alone
    can't switch the AC.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.qingping_air_monitor_lite_humidity
    above: 70
    for:
      minutes: 5
    id: humid
  - trigger: numeric_state
    entity_id: sensor.qingping_air_monitor_lite_humidity
    below: 60
    for:
      minutes: 5
    id: dry
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state not in [''unavailable'', ''unknown'']
      }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: humid
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.ac_on
      - action: notify.alexa_media
        data:
          message: Humidity is {{ states('sensor.qingping_air_monitor_lite_humidity')
            | round(0) }} percent. Turning the AC on.
          target: media_player.shubham_s_3rd_echo_dot
          data:
            type: tts
    - conditions:
      - condition: trigger
        id: dry
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.ac_off
      - action: notify.alexa_media
        data:
          message: Humidity is down to {{ states('sensor.qingping_air_monitor_lite_humidity')
            | round(0) }} percent. Turning the AC off.
          target: media_player.shubham_s_3rd_echo_dot
          data:
            type: tts
  mode: single
- id: '1790200000101'
  alias: High CO2 - Alexa says open the doors
  description: >-
    When the Qingping's CO2 stays above 1200 ppm for 5 minutes, the 3rd Echo Dot
    announces it and asks to open the doors. Fires once per crossing (numeric_state);
    skips the moment the sensor comes back from being unavailable.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
    above: 1200
    for:
      minutes: 5
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
  actions:
  - action: notify.alexa_media
    data:
      message: >-
        Warning. High carbon dioxide detected, {{ states('sensor.qingping_air_monitor_lite_co2_carbon_dioxide') | int }}
        parts per million. Please open the doors.
      target: media_player.shubham_s_3rd_echo_dot
      data:
        type: tts
  mode: single
- id: '1790200000102'
  alias: Welcome home - Alexa greets Shubham on home Wi-Fi
  description: >-
    Greets Shubham on the 3rd Echo Dot when he gets home. Two independent triggers (whichever the
    iPhone reports first): (1) the Companion app's SSID sensor changes to the home Wi-Fi
    (Tripleplay_A236...), (2) the iPhone's device_tracker enters the Home zone. iOS only reports
    Wi-Fi changes when the app is woken, so the zone trigger is the more reliable one when actually
    arriving. Ignores HA restarts / app reconnects (from unavailable/unknown) and won't repeat within
    30 minutes of the last greeting (so both triggers firing on one arrival = one greeting).
  triggers:
  - trigger: state
    entity_id: sensor.shubhams_iphone_ssid
    id: wifi
  - trigger: state
    entity_id: device_tracker.shubhams_iphone
    to: home
    id: zone
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: wifi
      - condition: template
        value_template: >-
          {{ trigger.to_state.state is search('Tripleplay_A236')
             and trigger.from_state.state not in ['unavailable', 'unknown']
             and not (trigger.from_state.state is search('Tripleplay_A236')) }}
    - condition: and
      conditions:
      - condition: trigger
        id: zone
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown', 'home'] }}"
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}
  actions:
  - action: notify.alexa_media
    data:
      message: Welcome back home, Master Shubham.
      target: media_player.shubham_s_3rd_echo_dot
      data:
        type: tts
  mode: single
