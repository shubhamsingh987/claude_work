<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cluster Chat</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#6b6b76; --card:#f1f1f4; --me:#2f6fed; --mefg:#fff; --line:#dcdce2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --fg:#ececf1; --muted:#9a9aa6; --card:#1e1e24; --me:#3b6fe0; --line:#2c2c34; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); padding-top: max(10px, env(safe-area-inset-top)); }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  header .model { color: var(--muted); font-size: 12px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 8px 12px; background: var(--card); color: var(--fg); }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; background: var(--card); }
  .msg.user { align-self: flex-end; background: var(--me); color: var(--mefg); }
  .msg.err { color: #d33; }
  .stats { color: var(--muted); font-size: 12px; align-self: flex-start; margin-top: -6px; }
  form { display: flex; gap: 8px; padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--fg); background: var(--card); border: 0; border-radius: 12px; padding: 10px 12px; max-height: 140px; }
  #send { background: var(--me); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Cluster Chat <span class="model" id="model"></span></h1>
  <button id="clear" type="button">New chat</button>
</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message" autocomplete="off"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const chat = document.getElementById('chat'), input = document.getElementById('input'),
      send = document.getElementById('send'), modelEl = document.getElementById('model');
let model = null, history = [], controller = null;
try { history = JSON.parse(localStorage.getItem('chat') || '[]'); } catch (e) {}

function save() { try { localStorage.setItem('chat', JSON.stringify(history)); } catch (e) {} }
function bubble(role, text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + role + (cls ? ' ' + cls : '');
  d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
history.forEach(m => bubble(m.role === 'user' ? 'user' : 'assistant', m.content));

fetch(new URL('v1/models', location.href), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(j => {
    const sel = document.createElement('select');
    sel.style.cssText = 'font:inherit;font-size:12px;background:var(--card);color:var(--muted);border:0;border-radius:8px;padding:2px 4px;max-width:45vw';
    j.data.forEach(m => sel.add(new Option(m.id, m.id)));
    model = sel.value; sel.onchange = () => { model = sel.value; };
    modelEl.replaceChildren(sel);
  })
  .catch(err => bubble('assistant', 'Could not load models from ' + new URL('v1/models', location.href) + ' — ' + err.message, 'err'));

document.getElementById('clear').onclick = () => { history = []; save(); chat.innerHTML = ''; };
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = input.value.trim(); if (!text || !model) return;
  input.value = ''; input.style.height = 'auto';
  history.push({ role: 'user', content: text }); bubble('user', text);
  const out = bubble('assistant', '…'); let acc = '', toks = 0; const t0 = performance.now();
  controller = new AbortController(); send.textContent = 'Stop';
  try {
    const r = await fetch('v1/chat/completions', { method: 'POST', signal: controller.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: history, stream: true, max_tokens: 1024 }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data:') || l.includes('[DONE]')) continue;
        const delta = JSON.parse(l.slice(5)).choices?.[0]?.delta?.content;
        if (delta) { acc += delta; toks++; out.textContent = acc; chat.scrollTop = chat.scrollHeight; }
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') { out.textContent = acc || ('Error: ' + err.message); out.classList.add('err'); }
  }
  if (acc) {
    history.push({ role: 'assistant', content: acc }); save();
    const s = document.createElement('div'); s.className = 'stats';
    s.textContent = (toks / ((performance.now() - t0) / 1000)).toFixed(1) + ' tok/s'; chat.appendChild(s);
  } else if (!out.classList.contains('err')) { out.remove(); history.pop(); }
  controller = null; send.textContent = 'Send';
});
</script>
</body>
</html>
