; Drop-in for asterisk.service. Install at:
;   /etc/systemd/system/asterisk.service.d/override.conf
; (create via `sudo systemctl edit asterisk` and paste the [Service]/[Unit]
; blocks below, or `sudo mkdir -p /etc/systemd/system/asterisk.service.d`
; then copy this file to override.conf there.)
;
; Default (LSB-generated) unit had Restart=no -- a crash for any reason
; just stayed down forever. This adds a real restart policy, with a longer
; StartLimitIntervalSec/Burst window so a genuine crash-loop (e.g. against
; a broken dependency) doesn't immediately hit systemd's give-up threshold.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=5
