- id: '1790102634665'
  alias: Humidity AC control - on above 30C and 60%, off below 55%
  description: 'AC on when it''s hot AND humid: Qingping temperature above 30 C (the
    sensor reports in F, the template converts) AND humidity above 60%, both holding
    for 5 minutes -> scene.ac_on. AC off when humidity stays below 55% for 5 minutes
    -> scene.ac_off. Each switch is announced on shubham''s 3rd Echo Dot. Unavailable
    sensor readings count as "not hot/humid", and the off trigger skips the moment
    the sensor comes back from unavailable.'
  triggers:
  - trigger: template
    value_template: "{% set t = states('sensor.qingping_air_monitor_lite_temperature')
      | float(none) %} {% set u = state_attr('sensor.qingping_air_monitor_lite_temperature',
      'unit_of_measurement') %} {% set c = ((t - 32) * 5 / 9) if (t is not none and
      u == '°F') else t %} {{ c is not none and c > 30\n   and states('sensor.qingping_air_monitor_lite_humidity')
      | float(0) > 60 }}"
    for:
      minutes: 5
    id: hot_humid
  - trigger: numeric_state
    entity_id: sensor.qingping_air_monitor_lite_humidity
    below: 55
    for:
      minutes: 5
    id: dry
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: hot_humid
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.ac_on
      - action: notify.alexa_media
        data:
          message: '{% set t = states(''sensor.qingping_air_monitor_lite_temperature'')
            | float(0) %} {% set u = state_attr(''sensor.qingping_air_monitor_lite_temperature'',
            ''unit_of_measurement'') %} It''s {{ (((t - 32) * 5 / 9) if u == ''°F''
            else t) | round(0) | int }} degrees and {{ states(''sensor.qingping_air_monitor_lite_humidity'')
            | float(0) | round(0) | int }} percent humidity. Turning the AC on.'
          target: media_player.shubham_s_3rd_echo_dot
          data:
            type: tts
    - conditions:
      - condition: trigger
        id: dry
      - condition: template
        value_template: '{{ trigger.from_state.state not in [''unavailable'', ''unknown'']
          }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.ac_off
      - action: notify.alexa_media
        data:
          message: Humidity is down to {{ states('sensor.qingping_air_monitor_lite_humidity')
            | float(0) | round(0) | int }} percent. Turning the AC off.
          target: media_player.shubham_s_3rd_echo_dot
          data:
            type: tts
  mode: single
- id: '1790200000101'
  alias: High CO2 - Alexa says open the doors
  description: When the Qingping's CO2 stays above 1200 ppm for 5 minutes, the 3rd
    Echo Dot announces it and asks to open the doors. Fires once per crossing (numeric_state);
    skips the moment the sensor comes back from being unavailable.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
    above: 1200
    for:
      minutes: 5
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state not in [''unavailable'', ''unknown'']
      }}'
  actions:
  - action: notify.alexa_media
    data:
      message: Warning. High carbon dioxide detected, {{ states('sensor.qingping_air_monitor_lite_co2_carbon_dioxide')
        | int }} parts per million. Please open the doors.
      target: media_player.shubham_s_3rd_echo_dot
      data:
        type: tts
  mode: single
