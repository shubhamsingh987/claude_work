# Market prices for the Markets dashboard. Generated by gen_markets.py (claude_work repo,
# haos-pi5/). Crypto: CoinGecko free API. Stocks/indices/FX: Yahoo v8 chart. No API keys.
- resource: https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=inr&include_24hr_change=true
  scan_interval: 180
  timeout: 20
  headers:
    User-Agent: Mozilla/5.0 (HomeAssistant markets dashboard)
  sensor:
  - name: Bitcoin price
    unique_id: markets_btc_price
    icon: mdi:bitcoin
    value_template: '{{ value_json[''bitcoin''][''inr''] }}'
    unit_of_measurement: ₹
    state_class: measurement
  - name: Bitcoin change 24h
    unique_id: markets_btc_change
    icon: mdi:percent
    value_template: '{{ value_json[''bitcoin''][''inr_24h_change''] | round(2) }}'
    unit_of_measurement: '%'
    state_class: measurement
  - name: Ethereum price
    unique_id: markets_eth_price
    icon: mdi:ethereum
    value_template: '{{ value_json[''ethereum''][''inr''] }}'
    unit_of_measurement: ₹
    state_class: measurement
  - name: Ethereum change 24h
    unique_id: markets_eth_change
    icon: mdi:percent
    value_template: '{{ value_json[''ethereum''][''inr_24h_change''] | round(2) }}'
    unit_of_measurement: '%'
    state_class: measurement
  - name: Solana price
    unique_id: markets_sol_price
    icon: mdi:alpha-s-circle
    value_template: '{{ value_json[''solana''][''inr''] }}'
    unit_of_measurement: ₹
    state_class: measurement
  - name: Solana change 24h
    unique_id: markets_sol_change
    icon: mdi:percent
    value_template: '{{ value_json[''solana''][''inr_24h_change''] | round(2) }}'
    unit_of_measurement: '%'
    state_class: measurement
- resource: https://query1.finance.yahoo.com/v8/finance/chart/^NSEI?interval=1d&range=1d
  scan_interval: 300
  timeout: 20
  headers:
    User-Agent: Mozilla/5.0 (HomeAssistant markets dashboard)
  sensor:
  - name: NIFTY 50 price
    unique_id: markets_nifty50_price
    icon: mdi:chart-line
    value_template: '{{ value_json.chart.result[0].meta.regularMarketPrice }}'
    unit_of_measurement: pts
    state_class: measurement
  - name: NIFTY 50 change
    unique_id: markets_nifty50_change
    icon: mdi:percent
    value_template: '{% set m = value_json.chart.result[0].meta %}{{ ((m.regularMarketPrice - m.chartPreviousClose) / m.chartPreviousClose * 100) | round(2) }}'
    unit_of_measurement: '%'
    state_class: measurement
