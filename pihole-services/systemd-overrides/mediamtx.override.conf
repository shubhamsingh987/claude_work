; Drop-in for mediamtx.service. Install at:
;   /etc/systemd/system/mediamtx.service.d/override.conf
;
; mediamtx already had Restart=always, but the default
; StartLimitIntervalSec=10 / StartLimitBurst=5 meant 5 crashes in 10 seconds
; (e.g. a burst of write failures against the CCTV recordings drive) made
; systemd give up restarting it PERMANENTLY -- this is exactly what
; happened on 2026-09-04: it crashed once when the drive corrupted and
; then just stayed dead for 2.5 weeks with no further restart attempts.
; Widening the window means it keeps trying instead of giving up.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=20
