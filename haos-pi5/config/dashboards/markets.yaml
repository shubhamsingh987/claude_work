# Markets dashboard (YAML mode). Generated by gen_markets.py.
title: Markets
views:
- title: Markets
  path: markets
  icon: mdi:finance
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Crypto (INR)
    - type: markdown
      content: |-
        | Crypto (INR) | Price | Change |
        |:--|--:|--:|
        | **Bitcoin** | ₹{{ '{:,.2f}'.format(states('sensor.bitcoin_price') | float(0)) }} | {% set c = states('sensor.bitcoin_change_24h') | float(0) %}<font color="{{ '#21c45d' if c >= 0 else '#ef4444' }}">{{ '▲' if c >= 0 else '▼' }} {{ '%+.2f' | format(c) }}%</font> |
        | **Ethereum** | ₹{{ '{:,.2f}'.format(states('sensor.ethereum_price') | float(0)) }} | {% set c = states('sensor.ethereum_change_24h') | float(0) %}<font color="{{ '#21c45d' if c >= 0 else '#ef4444' }}">{{ '▲' if c >= 0 else '▼' }} {{ '%+.2f' | format(c) }}%</font> |
        | **Solana** | ₹{{ '{:,.2f}'.format(states('sensor.solana_price') | float(0)) }} | {% set c = states('sensor.solana_change_24h') | float(0) %}<font color="{{ '#21c45d' if c >= 0 else '#ef4444' }}">{{ '▲' if c >= 0 else '▼' }} {{ '%+.2f' | format(c) }}%</font> |
    - type: sensor
      entity: sensor.bitcoin_price
      name: Bitcoin
      graph: line
      hours_to_show: 24
      detail: 2
      grid_options:
        columns: 6
    - type: sensor
      entity: sensor.ethereum_price
      name: Ethereum
      graph: line
      hours_to_show: 24
      detail: 2
      grid_options:
        columns: 6
    - type: sensor
      entity: sensor.solana_price
      name: Solana
      graph: line
      hours_to_show: 24
      detail: 2
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Indices & FX
    - type: markdown
      content: |-
        | Indices & FX | Price | Change |
        |:--|--:|--:|
        | **NIFTY 50** | {{ '{:,.2f}'.format(states('sensor.nifty_50_price') | float(0)) }} | {% set c = states('sensor.nifty_50_change') | float(0) %}<font color="{{ '#21c45d' if c >= 0 else '#ef4444' }}">{{ '▲' if c >= 0 else '▼' }} {{ '%+.2f' | format(c) }}%</font> |
        | **SENSEX** | {{ '{:,.2f}'.format(states('sensor.sensex_price') | float(0)) }} | {% set c = states('sensor.sensex_change') | float(0) %}<font color="{{ '#21c45d' if c >= 0 else '#ef4444' }}">{{ '▲' if c >= 0 else '▼' }} {{ '%+.2f' | format(c) }}%</font> |
        | **S&P 500** | {{ '{:,.2f}'.format(states('sensor.s_p_500_price') | float(0)) }} | {% set c = states('sensor.s_p_500_change') | float(0) %}<font color="{{ '#21c45d' if c >= 0 else '#ef4444' }}">{{ '▲' if c >= 0 else '▼' }} {{ '%+.2f' | format(c) }}%</font> |
        | **USD / INR** | ₹{{ '{:,.2f}'.format(states('sensor.usd_inr_price') | float(0)) }} | {% set c = states('sensor.usd_inr_change') | float(0) %}<font color="{{ '#21c45d' if c >= 0 else '#ef4444' }}">{{ '▲' if c >= 0 else '▼' }} {{ '%+.2f' | format(c) }}%</font> |
    - type: sensor
      entity: sensor.nifty_50_price
      name: NIFTY 50
      graph: line
      hours_to_show: 48
      detail: 2
      grid_options:
        columns: 6
    - type: sensor
